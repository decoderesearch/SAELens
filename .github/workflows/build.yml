name: build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # Allow this workflow to be called from other workflows
  workflow_call:
    inputs:
      #  Requires at least one input to be valid, but in practice we don't need any
      dummy:
        type: string
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Huggingface gets mad about us spamming them in CI, so try to run fewer versions of tests
        python-version: ["3.10"] # , "3.11", "3.12"]

    env:
      # Increment this number to bust all caches
      CACHE_VERSION: 10
      # CI has no GPU, so install CPU-only torch instead of the multi-GB CUDA build
      UV_TORCH_BACKEND: cpu

    steps:
      - uses: actions/checkout@v4
      - name: Install uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v10
        with:
          python-version: ${{ matrix.python-version }}
          # Creates .venv and puts it on PATH for later steps
          activate-environment: true
          enable-cache: false
      - name: Check available disk space
        id: disk
        run: echo "avail_gb=$(df --output=avail -BG / | tail -1 | tr -dc '0-9')" >> "$GITHUB_OUTPUT"
      - name: Free Disk Space (Ubuntu)
        # This job uses ~16GB of disk, and freeing space takes ~1.5 minutes, so
        # only free space on runners that are short on it.
        if: steps.disk.outputs.avail_gb < 40
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          large-packages: false
      - name: Cache Huggingface assets
        uses: actions/cache@v4
        with:
          key: huggingface-${{ env.CACHE_VERSION }}-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('**/pyproject.toml') }}
          path: ~/.cache/huggingface/hub
          restore-keys: |
            huggingface-${{ env.CACHE_VERSION }}-${{ runner.os }}-${{ matrix.python-version }}-
      - name: Install dependencies
        # There's no lockfile, so this resolves the latest versions on every run.
        # Don't use `uv sync` or `uv run` here: they lock and sync the project,
        # which would reinstall CUDA torch.
        run: uv pip install -e . --group dev
      - name: Install TransformerLens dev-3.x
        run: uv pip install git+https://github.com/TransformerLensOrg/TransformerLens.git@dev-3.x
      - name: Check disk space before tests
        run: |
          echo "=== Disk Space Summary ==="
          df -h
          echo ""
          echo "=== Home Directory Size ==="
          du -sh ~/* 2>/dev/null | sort -hr | head -20
          echo ""
          echo "=== Huggingface Cache Size ==="
          du -sh ~/.cache/huggingface 2>/dev/null || echo "No HF cache yet"
      - name: Check linting
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .
      - name: type checking
        run: pyright
      - name: Run Unit Tests
        #   Would use make, but want cov report in xml format
        #   TRACK_DISK_USAGE=1 enables per-test disk usage tracking (see tests/conftest.py)
        run: pytest -v --cov=sae_lens/ --cov-report=term-missing --cov-branch tests --cov-report=xml
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          TRACK_DISK_USAGE: "1"
      - name: Check disk space after tests
        if: always()
        run: |
          echo "=== Disk Space Summary After Tests ==="
          df -h
          echo ""
          echo "=== Huggingface Cache Size ==="
          du -sh ~/.cache/huggingface 2>/dev/null || echo "No HF cache"
          echo ""
          echo "=== Huggingface Cache Contents (Top 20) ==="
          du -sh ~/.cache/huggingface/* 2>/dev/null | sort -hr | head -20 || echo "No HF cache"
          echo ""
          echo "=== Largest directories in home ==="
          du -sh ~/* 2>/dev/null | sort -hr | head -20
          echo ""
          echo "=== Workspace size ==="
          du -sh ${{ github.workspace }}
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v4.0.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: decoderesearch/SAELens

  release:
    needs: build
    permissions:
      contents: write
      id-token: write
    # https://github.community/t/how-do-i-specify-job-dependency-running-in-another-workflow/16482
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/beta' || github.ref == 'refs/heads/alpha') && !contains(github.event.head_commit.message, 'chore(release):')
    runs-on: ubuntu-latest
    concurrency: release
    environment:
      name: pypi
    outputs:
      released: ${{ steps.release.outputs.released }}
      tag: ${{ steps.release.outputs.tag }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Semantic Release
        id: release
        uses: python-semantic-release/python-semantic-release@v9.8.8
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        if: steps.release.outputs.released == 'true'
      - name: Publish package distributions to GitHub Releases
        uses: python-semantic-release/upload-to-gh-release@main
        if: steps.release.outputs.released == 'true'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
